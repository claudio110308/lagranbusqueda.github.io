<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Nuestro Aniversario de 1.5 Años! 💞</title>
    <link rel="stylesheet" href="styles.css">
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>18 Meses Contigo 🌸</h1>
            <p class="subtitulo">Sigue las pistas para descubrir tu regalo...</p>
        </header>

        <!-- Pista 1 -->
        <div id="pista1" class="pista activa">
            <h2>🔎 Pista 1: El Inicio</h2>
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/TU_ID_VIDEO_1" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <p>¡Nuestra primera cita! Revisa donde guardabas los tickets del cine.</p>
            <button onclick="completarPista(1)">¡Listo!</button>
        </div>

        <!-- Pista 2 (bloqueada inicialmente) -->
        <div id="pista2" class="pista bloqueada">
            <h2>🎁 Pista 2: El Detalle</h2>
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/TU_ID_VIDEO_2" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <p>Busca donde escondo tus chocolates Kinder... ¡Suerte!</p>
            <button onclick="completarPista(2)">¡Encontrado!</button>
        </div>

        <!-- Más pistas... -->
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="scripts.js"></script>
</body>
</html>

<style>
body {
    background: #ffe6f2;
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0; /* Eliminar márgenes por defecto */
}

.container {
    max-width: 600px; /* Limitar el ancho máximo para pantallas grandes */
    margin: auto; /* Centrar el contenedor */
}

.pista {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.bloqueada {
    display: none;
}

.video-container {
    position: relative;
    padding-bottom: 56.25%; /* Mantener la relación de aspecto 16:9 */
    height: 0; /* Altura inicial 0 */
    overflow: hidden; /* Ocultar el desbordamiento */
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 10px;
}

button {
    background: #ff69b4;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
    width: 100%; /* Botón ocupa todo el ancho disponible */
    font-size: 16px; /* Aumentar el tamaño de la fuente para mejor legibilidad */
}

h1, h2, p {
    text-align: center; /* Centrar texto */
}

@media (max-width: 600px) {
    h1 {
        font-size: 24px; /* Ajustar tamaño de fuente en móviles */
    }
    h2 {
        font-size: 20px; /* Ajustar tamaño de fuente en móviles */
    }
    p {
        font-size
